<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>記録が、物語になる — Rive 試作</title>
<style>
  html,body{margin:0;background:#fff}
  body{min-height:100vh;display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
  .stage{width:min(92vw,1240px)}
  .band{position:relative;width:100%;aspect-ratio:3/1;border-radius:8px;overflow:hidden;background:#f2ece0}
  .band canvas,.band img{display:block;width:100%;height:100%;object-fit:cover}
  /* スマホでは帯を高めにして中央を大きく見せる（左右は切れてよい構図） */
  @media (max-width:640px){.band{aspect-ratio:16/9}}
  .note{font-size:13px;color:#666;margin:12px 2px 0}
</style>
</head>
<body>
<div class="stage">
  <div class="band" id="band" role="img" aria-label="小さな記録の断片が糸でつながり、ひとつの形にまとまっていくアニメーション"></div>
  <p class="note">試作：Rive（RMLのみ・スクリプトなし）。1周12秒。</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@rive-app/canvas@2.44.2/rive.js"></script>
<script>
(function () {
  var band = document.getElementById('band');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce || !window.rive) {
    // 動きを減らす設定では、形がまとまった場面の静止画だけを出す
    var img = new Image(); img.src = 'still.png'; img.alt = ''; band.appendChild(img);
    return;
  }
  var canvas = document.createElement('canvas');
  band.appendChild(canvas);
  var narrow = window.matchMedia('(max-width:640px)').matches;
  var r = new rive.Rive({
    src: 'records.riv',
    canvas: canvas,
    autoplay: true,
    stateMachine: 'State Machine 1',
    layout: new rive.Layout({ fit: narrow ? rive.Fit.Cover : rive.Fit.Contain, alignment: rive.Alignment.Center }),
    onLoad: function () { r.resizeDrawingSurfaceToCanvas(); },
    onLoadError: function () {
      canvas.remove();
      var img = new Image(); img.src = 'still.png'; img.alt = ''; band.appendChild(img);
    }
  });
  window.addEventListener('resize', function () { r.resizeDrawingSurfaceToCanvas(); });
})();
</script>
</body>
</html>

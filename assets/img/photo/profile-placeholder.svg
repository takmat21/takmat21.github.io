<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 170 1400 700" role="img" aria-label="図面から見積書、仕組みへと仕事がつながる墨の線画">
<defs>
<filter id="w"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="3"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .44  0 0 0 0 .35  0 0 0 .14 0"/></filter>
<filter id="i"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="1" seed="5" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="1.6"/></filter>
</defs>
<rect width="1400" height="1050" fill="#f1ebe0"/><rect width="1400" height="1050" filter="url(#w)"/>
<g transform="translate(700 520) scale(1.12) translate(-718 -520)"><g fill="none" stroke="#2b2b2b" stroke-linecap="round" stroke-linejoin="round" filter="url(#i)">
<!-- 図面 -->
<rect x="250" y="400" width="250" height="190" stroke-width="2.6" fill="#fbf8f2"/>
<path d="M275 425 H340 V545 H470" stroke-width="2"/><circle cx="305" cy="470" r="9" stroke-width="1.8"/>
<path d="M275 412 H340 M275 407 V417 M340 407 V417" stroke-width="1"/><path d="M485 425 V545 M480 425 H490 M480 545 H490" stroke-width="1"/>
<rect x="410" y="565" width="80" height="17" stroke-width="1.2"/>
<!-- 見積書 -->
<rect x="590" y="380" width="200" height="240" stroke-width="2.6" fill="#fbf8f2"/>
<path d="M615 410 H700" stroke-width="2.4"/>
<path d="M615 450 H765 M615 480 H765 M615 510 H765 M615 540 H740" stroke-width="1.2"/><path d="M710 440 V550" stroke-width="1"/>
<path d="M705 590 H765" stroke-width="2.4"/>
<!-- 仕組み（つながった3つの丸） -->
<circle cx="980" cy="420" r="26" stroke-width="2.4" fill="#fbf8f2"/>
<circle cx="915" cy="560" r="22" stroke-width="2.2" fill="#fbf8f2"/>
<circle cx="1045" cy="560" r="22" stroke-width="2.2" fill="#fbf8f2"/>
<path d="M968 444 L926 540 M992 444 L1034 540 M937 560 H1023" stroke-width="1.6"/>
<!-- 流れの線 -->
<path d="M505 495 C535 480 555 510 585 495" stroke-width="1.8"/><path d="M795 495 C830 480 850 470 880 470" stroke-width="1.8"/>
<circle cx="505" cy="495" r="3" fill="#2b2b2b" stroke="none"/><circle cx="585" cy="495" r="3" fill="#2b2b2b" stroke="none"/><circle cx="795" cy="495" r="3" fill="#2b2b2b" stroke="none"/><circle cx="880" cy="470" r="3" fill="#2b2b2b" stroke="none"/>
</g>
<g font-family="'Noto Serif JP',serif" font-size="20" fill="#6b6155" text-anchor="middle" letter-spacing="6">
<text x="375" y="660">図面</text><text x="690" y="660">見積</text><text x="980" y="660">仕組み</text></g>
<g transform="translate(1090 560) rotate(-4)"><rect width="76" height="76" rx="4" fill="none" stroke="#b8432f" stroke-width="3"/><text x="38" y="34" font-family="'Noto Serif JP',serif" font-size="20" font-weight="700" fill="#b8432f" text-anchor="middle">ZA</text><text x="38" y="60" font-family="'Noto Serif JP',serif" font-size="20" font-weight="700" fill="#b8432f" text-anchor="middle">ZOU</text></g>
</g></svg>

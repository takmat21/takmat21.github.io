function tree(x,z,ry,sc){add(cyl(.24,.17,.42,40),mPot,x,.21,z);add(cyl(.222,.222,.02,32),M({color:'#3b2f24',roughness:1}),x,.418,z,{cast:false});
 const g=new THREE.Group();lib['pachira_aquatica_01'].children.forEach(c=>{if(/_d$/.test(c.name)){const o=c.clone();o.position.set(0,0,0);g.add(o);}});g.position.set(x,.4,z);g.rotation.y=ry;g.scale.setScalar(sc);G.add(g);}
tree(8.3,5.7,.5,1.0);tree(5.45,.55,2.4,.82);tree(.6,5.85,4,.9);
add(box(W,.004,.03),mBrass,W/2,.002,D-.015,{cast:false});
// ---- 光 ----
scene.add(new THREE.HemisphereLight('#fff6e8','#b9a58a',.25));
const sun=new THREE.DirectionalLight('#fff1de',3.0);sun.position.set(17,7.5,7);sun.target.position.set(4,0,3.2);sun.castShadow=true;sun.shadow.mapSize.set(4096,4096);
Object.assign(sun.shadow.camera,{left:-7.5,right:7.5,top:7,bottom:-5,near:1,far:40});sun.shadow.bias=-.0005;sun.shadow.normalBias=.035;sun.shadow.radius=5;scene.add(sun,sun.target);
// ---- 仕上げ（影のなじみ）----
let composer=null;
try{composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,cam));const ao=new GTAOPass(scene,cam,2,2);ao.updateGtaoMaterial({radius:.45,distanceExponent:1.4,thickness:1.2,scale:1.15,samples:16});ao.blendIntensity=.9;composer.addPass(ao);composer.addPass(new OutputPass());composer.__ao=ao;}catch(e){composer=null;}
// ---- 視点 ----
const V={all:[[13.4,6.4,13.2],[4.3,.9,2.9]],lounge:[[7.6,1.6,8.9],[3.9,.85,2.6]],recep:[[3.3,1.5,5.5],[7.0,1.1,1.0]],bench:[[5.0,1.45,5.5],[.6,.95,2.6]],top:[[4.5,15.5,3.25],[4.5,0,3.2]],detail:[[5.9,1.05,5.6],[3.9,.6,3.7]]};
let goal=null;function go(k,now){const v=V[k]||V.all;if(now){cam.position.set(...v[0]);ctl.target.set(...v[1]);}else goal={p:new THREE.Vector3(...v[0]),t:new THREE.Vector3(...v[1])};
 document.querySelectorAll('button[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===k));}
document.querySelectorAll('button[data-v]').forEach(b=>b.onclick=()=>{ctl.autoRotate=false;spin.classList.remove('on');go(b.dataset.v);});
const spin=document.getElementById('spin');spin.onclick=()=>{ctl.autoRotate=!ctl.autoRotate;ctl.autoRotateSpeed=.8;spin.classList.toggle('on',ctl.autoRotate);goal=null;};
function size(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);if(composer){composer.setPixelRatio(renderer.getPixelRatio());composer.setSize(w,h);}cam.aspect=w/h;cam.fov=w<h?54:38;cam.updateProjectionMatrix();}
addEventListener('resize',size);size();
go(qs.get('cam')||'all',true);
if(stage.clientWidth<stage.clientHeight&&!qs.get('cam')){cam.position.set(15.5,9,17);}
renderer.domElement.addEventListener('pointerdown',()=>{goal=null;document.getElementById('hint').style.opacity=0;});
setTimeout(()=>document.getElementById('hint').style.opacity=0,5000);
let n=0;(function loop(){if(SHOT&&n>8)return;requestAnimationFrame(loop);if(goal){cam.position.lerp(goal.p,.08);ctl.target.lerp(goal.t,.08);if(cam.position.distanceTo(goal.p)<.02)goal=null;}ctl.update();if(composer)composer.render();else renderer.render(scene,cam);if(++n===6)window.__ready=true;})();
}catch(e){console.error(e);stage.style.display='none';document.getElementById('err').style.display='flex';window.__ready=true;}})();

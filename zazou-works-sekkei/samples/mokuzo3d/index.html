<header>
  <h1>3Dモデルと図面の見本｜木造2階建ての現況図</h1>
  <p>図面のない建物を、2階の実測と正面の写真1枚から立体に起こし、そこから平面図・立面図・外観図を出しています。指やマウスで回して見られます。（見本用の建物です。間口 3,640 × 奥行 9,100mm）</p>

if(q.get('shot'))document.body.classList.add('shot');
const stage=document.getElementById('stage');

// textures
function tex(w,h,draw,rx,ry){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx||1,ry||1);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;}

 inner:M({color:0xefe9db,roughness:.95}),

const tagged=[];const edgeMat=new THREE.LineBasicMaterial({color:0x1b1410,transparent:true,opacity:.28});
function box(x0,x1,y0,y1,z0,z1,material,tag,opt){ // building coords: x east, y up, z = -depth(front 0 → back -D)

 const me=new THREE.Mesh(g,material);me.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);

function sidMat(len,h,a,v,plaster){if(plaster){const t=tPlaster();t.repeat.set(len/2.2,h/2.2);t.offset.set((a/2.2)%1,(v/2.2)%1);return M({map:t,roughness:.95});}

// wall with openings. dir 'x': wall runs along x at depth yd (mm from front); dir 'y': runs along depth at x
function wall(dir,pos,a0,a1,v0,v1,openings,tag,plaster){
 const th=T;const segs=[];let cur=a0;const ops=openings.slice().sort((p,q)=>p.a-q.a);
 for(const o of ops){if(o.a>cur)segs.push([cur,o.a,v0,v1]);if(o.v0>v0)segs.push([o.a,o.b,v0,o.v0]);if(o.v1<v1)segs.push([o.a,o.b,o.v1,v1]);cur=o.b;}

  if(dir==='x'){const z=-m(pos);box(m(s[0]),m(s[1]),m(s[2]),m(s[3]),z,z-(pos===0?th:-th),mm,tag,{noEdge:true});}
  else{const x=m(pos);box(x,x+(pos===0?th:-th),m(s[2]),m(s[3]),-m(s[0]),-m(s[1]),mm,tag,{noEdge:true});}
 }

  const put=(a_0,a_1,vv0,vv1)=>{if(dir==='x'){const zf=-m(pos),sg=(pos===0?1:-1);box(m(a_0),m(a_1),m(vv0),m(vv1),zf-sg*.02,zf+sg*.022,mat.frame,tag,{noEdge:true});}else{const xf=m(pos),sg=(pos===0?-1:1);box(xf-sg*.02,xf+sg*.022,m(vv0),m(vv1),-m(a_0),-m(a_1),mat.frame,tag,{noEdge:true});}};

}
function opening(dir,pos,o,tag){

function gable(z,tag,s){const sh=new THREE.Shape();sh.moveTo(0,EAVE);sh.lineTo(W,EAVE);sh.lineTo(W/2,RIDGE);sh.closePath();

function roofSlab(sign){const len=Math.hypot(half,rise)+OE/Math.cos(ang);const t=tTile();t.repeat.set((D+2*OG)/1.9, len/1.5);t.rotation=Math.PI/2;
 const g=new THREE.BoxGeometry(len,.09,D+2*OG);const me=new THREE.Mesh(g,M({map:t,roughness:.6}));
 const cx=W/2+sign*(len/2)*Math.cos(ang), cy=RIDGE-(len/2)*Math.sin(ang)+.09;
 me.position.set(cx,cy,-D/2);me.rotation.z=-sign*ang;me.castShadow=me.receiveShadow=true;me.userData.tag='est';me.userData.base=me.material;tagged.push(me);
 me.add(new THREE.LineSegments(new THREE.EdgesGeometry(g,30),edgeMat));root.add(me);roofParts.push(me);}
roofSlab(1);roofSlab(-1);
roofParts.push(box(W/2-.13,W/2+.13,RIDGE+.08,RIDGE+.24,OG,-D-OG,mat.ridge,'est'));
// 破風板
for(const z of [OG,-D-OG])for(const s of [1,-1]){const len=Math.hypot(half,rise)+OE/Math.cos(ang);const g=new THREE.BoxGeometry(len,.16,.035);const me=new THREE.Mesh(g,mat.frame);me.position.set(W/2+s*(len/2)*Math.cos(ang),RIDGE-(len/2)*Math.sin(ang)-.03,z);me.rotation.z=-s*ang;me.castShadow=true;root.add(me);roofParts.push(me);}
// 庇（1階正面）
(function(){const pr=m(P.HISASHI.proj),y=m(P.HISASHI.v),a=.33;const len=pr/Math.cos(a);const t=tTile();t.repeat.set((W+.4)/1.9,len/1.5);t.rotation=Math.PI/2;
 const g=new THREE.BoxGeometry(W+.4,.06,len);const me=new THREE.Mesh(g,M({map:t,roughness:.6}));me.position.set(W/2,y-Math.sin(a)*len/2,Math.cos(a)*len/2);me.rotation.x=a;me.castShadow=me.receiveShadow=true;me.userData.tag='pho';me.userData.base=me.material;tagged.push(me);me.add(new THREE.LineSegments(new THREE.EdgesGeometry(g,30),edgeMat));root.add(me);
 for(const x of [.12,W/2,W-.12]){box(x-.035,x+.035,y-.62,y-.05,0,.05,mat.frame,null,{noEdge:true});const bg=new THREE.BoxGeometry(.05,.05,pr*.9);const b=new THREE.Mesh(bg,mat.frame);b.position.set(x,y-.36,pr*.42);b.rotation.x=.62;b.castShadow=true;root.add(b);}
 box(.25,m(2100),FL1-.42,FL1-.05,.0,.5,mat.found,'pho');box(.4,m(1950),FL1-.22,FL1-.05,.5,.78,mat.found,'pho'); // 玄関の段
})();
// 2F interior
const interior=new THREE.Group();root.add(interior);
box(TI,W-TI,FL2-.14,FL2,-TI,-D+TI,mat.woodLt,null,{noEdge:true});
for(const r of P.rooms){const y=FL2+.012;const g=new THREE.PlaneGeometry(m(r.x1-r.x0)-.04,m(r.y1-r.y0)-.04);const mt=(r.floor==='tatami'?mat.tatami.clone():mat.floorW.clone());mt.map=(r.floor==='tatami'?tTatami():tWoodFloor());mt.map.repeat.set(m(r.x1-r.x0)/.9,m(r.y1-r.y0)/.9);
 const me=new THREE.Mesh(g,mt);me.rotation.x=-Math.PI/2;me.position.set(m(r.x0+r.x1)/2,y,-m(r.y0+r.y1)/2);me.receiveShadow=true;me.userData.tag='mea';me.userData.base=mt;tagged.push(me);interior.add(me);
 if(r.floor==='tatami'){ // 畳の縁
  const nx=Math.round((r.x1-r.x0)/910),ny=Math.round((r.y1-r.y0)/1820);for(let i=1;i<nx;i++)box(m(r.x0+(r.x1-r.x0)*i/nx)-.012,m(r.x0+(r.x1-r.x0)*i/nx)+.012,y,y+.004,-m(r.y0)-.03,-m(r.y1)+.03,M({color:0x3d4a3a}),null,{noEdge:true,noCast:true,parent:interior});
  for(let j=1;j<ny;j++)box(m(r.x0)+.03,m(r.x1)-.03,y,y+.004,-m(r.y0+(r.y1-r.y0)*j/ny)-.012,-m(r.y0+(r.y1-r.y0)*j/ny)+.012,M({color:0x3d4a3a}),null,{noEdge:true,noCast:true,parent:interior});}
}
for(const w of P.partitions){const h0=FL2,h1=FL2+m(P.CH2);const ops=(w.ops||[]).slice().sort((a,b)=>a.a-b.a);let cur=w.a0;const segs=[];
 for(const o of ops){if(o.a>cur)segs.push([cur,o.a,h0,h1]);segs.push([o.a,o.b,h0+m(o.h||1800),h1,o.fus]);cur=o.b;}if(cur<w.a1)segs.push([cur,w.a1,h0,h1]);
 for(const s of segs){if(w.dir==='x')box(m(s[0]),m(s[1]),s[2],s[3],-m(w.pos)+TI/2,-m(w.pos)-TI/2,mat.inner,'mea',{parent:interior});else box(m(w.pos)-TI/2,m(w.pos)+TI/2,s[2],s[3],-m(s[0]),-m(s[1]),mat.inner,'mea',{parent:interior});}
 for(const o of ops)if(o.fus){if(w.dir==='x')box(m(o.a),m(o.b),h0,h0+m(o.h||1800),-m(w.pos)+.015,-m(w.pos)-.015,mat.shoji,'mea',{parent:interior});else box(m(w.pos)-.015,m(w.pos)+.015,h0,h0+m(o.h||1800),-m(o.a),-m(o.b),mat.shoji,'mea',{parent:interior});}
}
// stair (上り：奥→手前)
(function(){const s=P.stair,n=s.n;const run=(s.y1-s.y0-s.landing)/n;for(let i=0;i<n;i++){const top=FL2-(i+1)*(m(P.FL2-P.FL1)/(n+1));const ya=s.y0+s.landing+i*run;box(m(s.x0)+.05,m(s.x1)-.03,top-.04,top,-m(ya),-m(ya+run)-.02,mat.stair,'mea',{parent:interior});}
 box(m(s.x1)-.03,m(s.x1)+.03,FL2,FL2+.85,-m(s.y0+s.landing),-m(s.y1),mat.wood,'mea',{parent:interior,noEdge:true});})();
// neighbours (ghost)
const ghosts=new THREE.Group();root.add(ghosts);
for(const n of P.neighbors){const g=new THREE.BoxGeometry(m(n.x1-n.x0),m(n.h),m(n.y1-n.y0));const me=new THREE.Mesh(g,mat.ghost);me.position.set(m(n.x0+n.x1)/2,m(n.h)/2,-m(n.y0+n.y1)/2);me.renderOrder=2;ghosts.add(me);
 const e=new THREE.LineSegments(new THREE.EdgesGeometry(g),new THREE.LineDashedMaterial({color:0x6b7b82,dashSize:.25,gapSize:.18,transparent:true,opacity:.75}));e.computeLineDistances();me.add(e);}
// ground & street
const gnd=new THREE.Mesh(new THREE.CircleGeometry(40,64),M({map:(()=>{const t=tGround();t.repeat.set(30,30);return t;})(),roughness:1}));gnd.rotation.x=-Math.PI/2;gnd.receiveShadow=true;scene.add(gnd);
const st=new THREE.Mesh(new THREE.PlaneGeometry(60,4.2),M({map:(()=>{const t=tAsphalt();t.repeat.set(30,2);return t;})(),roughness:1}));st.rotation.x=-Math.PI/2;st.position.set(0,.006,D/2+1.2+2.1);st.receiveShadow=true;scene.add(st);
const curb=new THREE.Mesh(new THREE.BoxGeometry(60,.1,.14),M({color:0xc9c9c4}));curb.position.set(0,.05,D/2+1.2);curb.receiveShadow=true;scene.add(curb);
// labels (plan mode)
const labels=new THREE.Group();root.add(labels);labels.visible=false;
function label(text,sub,x,z){const c=document.createElement('canvas');c.width=512;c.height=220;const g=c.getContext('2d');g.textAlign='center';g.fillStyle='rgba(255,255,255,.9)';const w=Math.max(g.measureText(text).width,10);g.font='700 78px "Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,"IPAPGothic",sans-serif';const tw=g.measureText(text).width;g.beginPath();g.roundRect(256-tw/2-28,14,tw+56,sub?190:110,26);g.fill();g.fillStyle='#1d2a2e';g.fillText(text,256,96);if(sub){g.font='500 54px "Hiragino Sans","Noto Sans JP","Yu Gothic",Meiryo,"IPAPGothic",sans-serif';g.fillStyle='#56666b';g.fillText(sub,256,172);}
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false,transparent:true}));sp.scale.set(1.7,.73,1);sp.position.set(x,FL2+1.0,z);sp.renderOrder=10;labels.add(sp);}
for(const r of P.rooms)label(r.name,r.sub||'',m(r.x0+r.x1)/2,-m(r.y0+r.y1)/2);
// modes
const clip=new THREE.Plane(new THREE.Vector3(0,-1,0),FL2+1.25);
let planMode=false,basisMode=false;
function setPlan(on){planMode=on;renderer.clippingPlanes=on?[clip]:[];for(const r of roofParts)r.visible=!on;labels.visible=on;ghosts.visible=!on||true;}
function setBasis(on){basisMode=on;for(const me of tagged){me.material=on?mat[me.userData.tag]:me.userData.base;}document.getElementById('legend').style.display=on?'block':'none';document.getElementById('hint').style.opacity=0;document.getElementById('basis').classList.toggle('on',on);}
const views={iso:{p:[7.6,5.2,12.2],t:[0,3.0,0.6]},front:{p:[0.4,3.4,17.5],t:[0,3.2,0]},plan:{p:[3.6,13.2,5.6],t:[0,3.0,-.2]}};
let anim=null;
function go(name,instant){const v=views[name];setPlan(name==='plan');const t1=new THREE.Vector3(...v.t);const k0=(stage.clientWidth/stage.clientHeight<.8)?1.75:1;const p1=new THREE.Vector3(...v.p).sub(t1).multiplyScalar(k0).add(t1);
 if(instant){cam.position.copy(p1);ctl.target.copy(t1);ctl.update();return;}
 const p0=cam.position.clone(),t0=ctl.target.clone();const s=performance.now();anim=(now)=>{let k=Math.min(1,(now-s)/700);k=k*k*(3-2*k);cam.position.lerpVectors(p0,p1,k);ctl.target.lerpVectors(t0,t1,k);if(k>=1)anim=null;};
 document.querySelectorAll('button[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===name));}
document.querySelectorAll('button[data-v]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.v)));
document.getElementById('basis').addEventListener('click',()=>setBasis(!basisMode));
const spinB=document.getElementById('spin');spinB.addEventListener('click',()=>{ctl.autoRotate=!ctl.autoRotate;spinB.classList.toggle('on',ctl.autoRotate);});ctl.autoRotateSpeed=1.1;
renderer.domElement.addEventListener('pointerdown',()=>{document.getElementById('hint').style.opacity=0;},{once:true});
function size(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.fov=(w/h<.8?44:36);cam.updateProjectionMatrix();}
addEventListener('resize',size);size();
go(q.get('v')||'iso',true);if(q.get('v'))document.querySelectorAll('button[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===q.get('v')));
if(q.get('basis'))setBasis(true);
if(q.get('cam')){const c=q.get('cam').split(',').map(Number);cam.position.set(c[0],c[1],c[2]);ctl.target.set(c[3],c[4],c[5]);ctl.update();}
function loop(now){requestAnimationFrame(loop);if(anim)anim(now);ctl.update();renderer.render(scene,cam);}
requestAnimationFrame(loop);window.__ready=true;
